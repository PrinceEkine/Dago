<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>New Tab</title>
<style>
  :root {
    --nt-bg: #1a1b26;
    --nt-wordmark: #3b4261;
    --nt-hint: #565f89;
    --nt-code-bg: #24283b;
    --nt-code: #7aa2f7;
  }
  [data-theme="light"] {
    --nt-bg: #e6e7ed;
    --nt-wordmark: #b9bdd0;
    --nt-hint: #8b91ad;
    --nt-code-bg: #d4d7e2;
    --nt-code: #2f5fd0;
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--nt-bg);
    color: var(--nt-hint);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .center { text-align: center; }
  .wordmark { font-size: 42px; font-weight: 600; color: var(--nt-wordmark); letter-spacing: 2px; }
  .hint { margin-top: 12px; font-size: 13px; }
  code { background: var(--nt-code-bg); padding: 2px 6px; border-radius: 4px; color: var(--nt-code); }
</style>
<script src="theme-init.js"></script>
</head>
<body>
  <div class="center">
    <div class="wordmark">Dago</div>
    <div class="hint">Type an address, or visit <code>dago://history</code> / <code>dago://settings</code> / <code>dago://screenshare</code></div>
  </div>
</body>
</html>
